{% extends "base.html" %}
{% block title %}Edit {{ family.name }} - WhatsBot{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <a href="/families" class="text-muted"><i class="bi bi-arrow-left"></i> Back to Families</a>
        <h2 class="mt-2"><i class="bi bi-pencil"></i> Edit Family: {{ family.name }}</h2>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" action="/families/{{ family.id }}/edit">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Family Name (English) *</label>
                        <input type="text" class="form-control" name="name" value="{{ family.name }}" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Family Name (Arabic)</label>
                        <input type="text" class="form-control" name="name_ar" value="{{ family.name_ar or '' }}" dir="rtl">
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Keywords (comma separated)</label>
                <input type="text" class="form-control" name="keywords" value="{{ family.keywords or '' }}">
                <small class="text-muted">Bot will detect these keywords and use variant flow</small>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="has_sizes" id="hasSizes" {% if family.has_sizes %}checked{% endif %}>
                        <label class="form-check-label" for="hasSizes">
                            <i class="bi bi-rulers"></i> Has Size Variants
                        </label>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="has_colors" id="hasColors" {% if family.has_colors %}checked{% endif %}>
                        <label class="form-check-label" for="hasColors">
                            <i class="bi bi-palette"></i> Has Color Variants
                        </label>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label">Selection Order</label>
                        <select class="form-select" name="selection_order">
                            <option value="size_first" {% if family.selection_order == 'size_first' %}selected{% endif %}>Size first, then Color</option>
                            <option value="color_first" {% if family.selection_order == 'color_first' %}selected{% endif %}>Color first, then Size</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-whatsapp">
                    <i class="bi bi-save"></i> Save Changes
                </button>
                <a href="/families" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
